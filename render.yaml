services:
  - type: web
    name: veterinaria
    env: python
    region: oregon
    plan: free
    buildCommand: bash vet3/vet3/build.sh
    startCommand: python manage.py migrate && gunicorn vet3.vet3.wsgi:application --bind 0.0.0.0:${PORT:-8000} --timeout 60 --workers 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veterinaria-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DATABASE_SSL_REQUIRE
        value: "False"
      - key: USE_MANIFEST_STATICFILES
        value: "False"

databases:
  - name: db_veterinaria
    region: oregon
    plan: free
    ipAllowList: []