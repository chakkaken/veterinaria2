version: '3.8'

services:
  db:
    image: postgres:15
    container_name: vet_db
    environment:
      POSTGRES_DB: vet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: vet_web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=tu-clave-secreta
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=*
      - DB_NAME=vet_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - EMAIL_HOST_USER=kelvinjn33@gmail.com
      - EMAIL_HOST_PASSWORD=utxb aicq hmfc pzsp
    depends_on:
      - db

volumes:
  postgres_data:
  media_volume:
