{% extends 'base.html' %}

{% block title %}Eliminar Raza{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-danger text-white text-center py-3">
                    <h2 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Confirmar Eliminación</h2>
                </div>
                <div class="card-body p-4">
                    <p class="lead text-center mb-4">
                        ¿Está seguro que desea eliminar la raza <strong>"{{ object.Nombre }}"</strong>?
                    </p>

                    {% if object.imagen %}
                    <div class="text-center mb-4">
                        <img src="{{ object.imagen.url }}" alt="{{ object.Nombre }}" class="img-fluid rounded shadow-sm" style="max-height: 250px;">
                    </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="{% url 'razas_list' %}" class="btn btn-lg btn-outline-secondary">
                                <i class="fas fa-times me-2"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-lg btn-danger">
                                <i class="fas fa-trash me-2"></i> Confirmar Eliminación
                            </button>
                            <div class="d-flex justify-content-between align-items-center mt-4">
                                <a href="{% url 'razas_list' %}" class="btn btn-lg btn-outline-secondary">
                                    <i class="fas fa-times me-2"></i> volver
                                </a>
                            <a>
                                
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
