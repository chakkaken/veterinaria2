{% extends 'base.html' %}

{% block title %}Eliminar Dueño{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">Confirmar Eliminación</h3>
                </div>
                <div class="card-body">
                    <p class="lead">¿Está seguro que desea eliminar al dueño "{{ object.Nombre }} {{ object.Apellido }}"?</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="text-end">
                            <a href="{% url 'duenos_list' %}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash"></i> Confirmar Eliminación
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
