<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0f1117;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 20%, rgba(108,99,255,.18) 0%, transparent 60%),
                radial-gradient(ellipse 50% 60% at 80% 80%, rgba(78,205,196,.12) 0%, transparent 60%);
            pointer-events: none;
        }

        .container {
            text-align: center;
            max-width: 500px;
            margin: auto;
            padding: 50px 40px;
            background: #1a1d27;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,.4);
            position: relative;
            z-index: 1;
            animation: fadeUp .5s ease;
        }

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .logo-icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #6c63ff, #4ecdc4);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            color: #e8eaf0;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1rem;
            color: #7b8099;
            margin-bottom: 40px;
        }

        .buttons-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 36px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6c63ff, #8b82ff);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108,99,255,.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,.06);
            color: #e8eaf0;
            border: 1px solid rgba(255,255,255,.1);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,.1);
            transform: translateY(-2px);
        }

        footer {
            position: absolute;
            bottom: 20px;
            color: #7b8099;
            font-size: 0.85em;
            z-index: 1;
        }

        @media (max-width: 600px) {
            .container { margin: 20px; padding: 30px 20px; }
            h1 { font-size: 1.6rem; }
            .buttons-container { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-icon">
            <i class="fa-solid fa-paw"></i>
        </div>
        <h1>VetSystem</h1>
        <p class="subtitle">Sistema de Gestión Veterinaria</p>

        <div class="buttons-container">
            <a href="{% url 'login' %}" class="btn btn-primary">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
            </a>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                <i class="fa-solid fa-gauge-high"></i> Ver Dashboard
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 VetSystem - Todos los derechos reservados</p>
        <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px;">
            <span style="font-size:0.85em;">Desarrollado por</span>
            <img src="{% static 'logo3.svg' %}" alt="Logo" style="height:24px; width:auto;">
        </div>
    </footer>

</body>
</html>
