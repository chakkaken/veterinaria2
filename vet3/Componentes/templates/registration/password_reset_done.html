{% extends 'base.html' %}
{% block title %}Correo Enviado{% endblock %}
{% block page_title %}Correo Enviado{% endblock %}

{% block content %}
<div style="max-width:480px; margin:40px auto 0;">
    <div class="card" style="text-align:center;">
        <div class="card-body" style="padding:40px 20px;">
            <div style="font-size:3rem;margin-bottom:16px;">✉️</div>
            <h3>Correo enviado</h3>
            <p style="color:var(--text-muted);margin:16px 0 24px;">
                Hemos enviado un correo con las instrucciones para restablecer tu contraseña.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary">
                <i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
