{% extends 'base.html' %}
{% block title %}Contraseña Restablecida{% endblock %}
{% block page_title %}Contraseña Restablecida{% endblock %}

{% block content %}
<div style="max-width:480px; margin:40px auto 0;">
    <div class="card" style="text-align:center;">
        <div class="card-body" style="padding:40px 20px;">
            <div style="font-size:3rem;margin-bottom:16px;">✅</div>
            <h3>Contraseña restablecida</h3>
            <p style="color:var(--text-muted);margin:16px 0 24px;">
                Tu contraseña ha sido restablecida correctamente.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
